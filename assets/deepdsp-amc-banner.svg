<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">DEEPDSP AMC project banner</title>
  <desc id="desc">A restrained animated banner for a digital modulation classification project</desc>
  <rect width="1200" height="280" rx="24" fill="#071827"/>
  <rect x="48" y="42" width="8" height="196" rx="4" fill="#20b8c5">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="86" y="92" fill="#77d9df" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">DIGITAL SIGNAL PROCESSING</text>
  <text x="82" y="157" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">DEEPDSP AMC</text>
  <text x="85" y="202" fill="#b7c7d6" font-family="Arial, Helvetica, sans-serif" font-size="22">Automatic Modulation Classification</text>
  <rect x="785" y="61" width="345" height="48" rx="12" fill="#0e3449">
    <animate attributeName="fill" values="#0e3449;#13546a;#0e3449" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="957.5" y="92" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle">DSP FEATURES AND RANDOM FOREST</text>
  <rect x="785" y="121" width="345" height="48" rx="12" fill="#12365c">
    <animate attributeName="fill" values="#12365c;#1b5b86;#12365c" dur="4s" begin="1s" repeatCount="indefinite"/>
  </rect>
  <text x="957.5" y="152" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle">COMPACT ONE DIMENSIONAL CNN</text>
  <rect x="785" y="181" width="345" height="48" rx="12" fill="#15453f">
    <animate attributeName="fill" values="#15453f;#1b725f;#15453f" dur="4s" begin="2s" repeatCount="indefinite"/>
  </rect>
  <text x="957.5" y="212" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle">WEIGHTED PROBABILITY FUSION</text>
</svg>
